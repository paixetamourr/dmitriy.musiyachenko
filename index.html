<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дмитрий Мусияченко — UI/UX и Web-дизайнер</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #EBEBEB;
    --black: #050505;
    --white: #ffffff;
    --blue: #0048FF;
    --footer: #D5D5D5;
    --line: rgba(255,255,255,.92);
    --dark-line: rgba(0,0,0,.36);
    --case-width: min(920px, calc(100vw - 48px));
    --page-pad: 32px;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }

  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--black);
    cursor: none;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--blue); color: var(--white); }
  a, button { color: inherit; font: inherit; }
  a { text-decoration: none; }
  img { max-width: 100%; display: block; }

  .cursor {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 9999;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--white);
    pointer-events: none;
    transform: translate(-50%, -50%);
    mix-blend-mode: difference;
    transition: width .25s var(--ease), height .25s var(--ease), background .2s var(--ease), opacity .2s var(--ease);
    will-change: transform;
  }
  .cursor.hover {
    width: 42px;
    height: 42px;
    background: var(--blue);
  }



  .preloader {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: grid;
    place-items: center;
    background: var(--bg);
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity .45s var(--ease), visibility .45s var(--ease);
  }
  .preloader.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .preloader-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .preloader-smile {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--blue);
    color: var(--white);
    position: relative;
    animation: preloaderSmile 1.05s cubic-bezier(.45, 0, .18, 1) infinite alternate;
  }
  .preloader-smile::before,
  .preloader-smile::after {
    content: '';
    position: absolute;
    left: 50%;
    pointer-events: none;
  }
  .preloader-smile::before {
    top: 23px;
    width: 24px;
    height: 6px;
    transform: translateX(-50%);
    background:
      radial-gradient(circle at 4px 3px, currentColor 0 2.4px, transparent 2.55px),
      radial-gradient(circle at 20px 3px, currentColor 0 2.4px, transparent 2.55px);
  }
  .preloader-smile::after {
    top: 35px;
    width: 22px;
    height: 11px;
    transform: translateX(-50%);
    border-bottom: 2.4px solid currentColor;
    border-radius: 0 0 22px 22px;
  }
  @keyframes preloaderSmile {
    0%, 100% { background: var(--blue); color: var(--white); }
    50% { background: var(--white); color: var(--black); }
  }
  .preloader-progress {
    width: 92px;
    height: 5px;
    margin-top: 18px;
    background: var(--white);
    overflow: hidden;
  }
  .preloader-progress::before {
    content: '';
    display: block;
    width: 100%;
    height: 100%;
    background: var(--blue);
    transform-origin: left center;
    transform: scaleX(0);
    animation: preloaderProgress 1.15s cubic-bezier(.45, 0, .18, 1) forwards;
  }
  @keyframes preloaderProgress {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }

  .page-loader {
    position: fixed;
    inset: 0;
    z-index: 9990;
    display: grid;
    place-items: center;
    background: var(--bg);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .28s var(--ease), visibility .28s var(--ease);
  }
  .page-loader.is-active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }
  body.is-poster .page-loader { background: #000; }
  .page-loader .preloader-progress { margin-top: 0; }
  .page-loader .preloader-progress::before {
    animation: none;
    transform: scaleX(0);
  }
  .page-loader.is-active .preloader-progress::before {
    animation: preloaderProgress 1.05s cubic-bezier(.45, 0, .18, 1) forwards;
  }

  .site-nav {
    position: fixed;
    z-index: 1000;
    inset: 0 0 auto 0;
    pointer-events: none;
    font-size: 14px;
    line-height: 1;
    font-weight: 600;
  }
  .nav-left,
  .nav-right {
    position: absolute;
    top: 28px;
    pointer-events: auto;
  }
  .nav-left { left: var(--page-pad); display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
  .nav-right { right: var(--page-pad); display: flex; flex-direction: column; gap: 22px; align-items: flex-start; }
  .nav-right .nav-link { font-weight: 400; }
  .nav-link,
  .lang-btn,
  .back-control {
    border: 0;
    background: transparent;
    padding: 0;
    cursor: pointer;
    color: var(--black);
    transition: color .25s var(--ease), transform .25s var(--ease), opacity .25s var(--ease), background .25s var(--ease);
    position: relative;
    text-align: left;
  }
  .nav-link::after,
  .back-control::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -4px;
    width: 100%;
    height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .28s var(--ease);
  }
  .nav-link:hover::after,
  .back-control:hover::after { transform: scaleX(1); }
  .nav-link:hover,
  .back-control:hover { color: var(--blue); transform: translateX(2px); }
  .back-control { display: none; }
  body.is-project .back-control { display: inline-block; }
  body.is-poster .nav-link,
  body.is-poster .back-control { color: var(--white); }
  body.is-poster .nav-link:hover,
  body.is-poster .back-control:hover { color: var(--white); opacity: .84; }

  .lang-switch { display: inline-flex; gap: 0; align-items: center; }
  .lang-btn {
    background: var(--white);
    color: #9b9b9b;
    padding: 3px 7px 4px;
    font-size: 12px;
    font-weight: 500;
  }
  .lang-btn.active {
    background: var(--blue);
    color: var(--white);
    font-weight: 600;
  }
  .lang-btn:not(.active):hover { color: var(--blue); }

  main { min-height: 100vh; }
  .page { animation: pageIn .55s var(--ease) both; }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .home-hero {
    padding: 112px var(--page-pad) 34px;
    display: grid;
    grid-template-columns: minmax(310px, 28.6vw) minmax(560px, 1fr);
    gap: 54px;
    align-items: stretch;
  }
  .portrait-frame {
    width: 100%;
    height: 100%;
    min-height: clamp(560px, 42vw, 700px);
    border: 1px solid var(--black);
    background: #dedede;
    overflow: hidden;
    position: relative;
  }
  .portrait-frame img { width: 100%; height: 100%; object-fit: cover; }
  .image-missing::after,
  .portrait-frame.is-missing::after,
  .work-thumb.is-missing::after,
  .image-frame.is-missing::after,
  .poster-item.is-missing::after {
    content: attr(data-file);
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 22px;
    text-align: center;
    font-size: 12px;
    line-height: 1.35;
    color: rgba(0,0,0,.44);
    background:
      linear-gradient(135deg, rgba(255,255,255,.56), rgba(255,255,255,0) 42%),
      repeating-linear-gradient(45deg, rgba(0,0,0,.035) 0 8px, transparent 8px 16px),
      #dedede;
  }

  .intro {
    padding-top: 6px;
    height: 100%;
    min-height: clamp(560px, 42vw, 700px);
    display: flex;
    flex-direction: column;
  }
  .intro .data-table + .info-title { margin-top: clamp(34px, 4vw, 58px) !important; }
  .name-title {
    font-size: clamp(34px, 3.05vw, 52px);
    line-height: .96;
    letter-spacing: -.055em;
    font-weight: 500;
    margin: 0 0 14px;
  }
  .role {
    font-size: 16px;
    line-height: 1.25;
    font-weight: 600;
    margin: 0 0 18px;
  }
  .lead {
    max-width: 840px;
    font-size: 15px;
    line-height: 1.45;
    margin: 0 0 clamp(34px, 4vw, 58px);
    text-wrap: pretty;
  }
  .info-title {
    font-size: 14px;
    font-weight: 500;
    margin: 0 0 10px;
  }
  .data-table { width: 100%; font-size: 14px; line-height: 1.35; }
  .data-row {
    display: grid;
    grid-template-columns: minmax(126px, 0.28fr) 28px minmax(0, 1fr);
    align-items: start;
    gap: 20px;
    padding: 14px 0;
    border-top: 1px solid var(--line);
  }
  .data-row:last-child { border-bottom: 1px solid var(--line); }
  .data-label { font-weight: 600; }
  .data-colon { font-weight: 600; }
  .data-value { text-wrap: pretty; }
  .data-value a {
    border-bottom: 1px solid currentColor;
    transition: color .2s var(--ease), border-color .2s var(--ease);
  }
  .data-value a:hover { color: var(--blue); border-color: var(--blue); }

  .more-row {
    padding: 6px var(--page-pad) 60px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    column-gap: 16px;
    align-items: end;
    position: relative;
  }
  .more-resume {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 24px;
    position: relative;
  }
  .more-resume::before {
    content: '';
    position: absolute;
    left: calc(18.5ch + 18px);
    top: 13px;
    width: clamp(86px, 8.6vw, 126px);
    height: 43px;
    border-top: 1px solid var(--black);
    border-right: 1px solid var(--black);
    border-bottom: 1px solid var(--black);
    pointer-events: none;
  }
  .more-resume::after {
    content: '';
    position: absolute;
    left: calc(18.5ch + 11px);
    top: 51px;
    width: 9px;
    height: 9px;
    border-left: 1px solid var(--black);
    border-bottom: 1px solid var(--black);
    transform: rotate(45deg);
    pointer-events: none;
  }
  .more-hint {
    display: inline-flex;
    flex-direction: column;
    gap: 12px;
    width: max-content;
    max-width: 100%;
    font-size: 14px;
    line-height: 1.1;
    position: relative;
  }
  .more-hint::after { content: none; }
  .text-button {
    display: inline-flex;
    width: max-content;
    max-width: 100%;
    align-items: center;
    gap: 9px;
    padding: 2px 5px 3px;
    background: var(--white);
    font-size: 16px;
    line-height: 1.1;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    transition: color .25s var(--ease), background .25s var(--ease), transform .25s var(--ease);
  }
  .resume-button { position: relative; }
  .text-button:hover {
    color: var(--white);
    background: var(--blue);
    transform: translateY(-2px);
  }
  .text-button .arrow { font-weight: 600; transition: transform .25s var(--ease); }
  .text-button:hover .arrow { transform: translateX(4px); }
  .more-row > .text-button { justify-self: start; }

  .blue-orb {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--blue);
    margin-left: var(--page-pad);
    margin-bottom: 56px;
    animation: orbRoll 4.1s cubic-bezier(.45, 0, .18, 1) infinite alternate;
    will-change: transform;
    position: relative;
  }
  .blue-orb::before,
  .blue-orb::after {
    content: '';
    position: absolute;
    left: 50%;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s var(--ease);
  }
  .blue-orb::before {
    top: 16px;
    width: 20px;
    height: 5px;
    transform: translateX(-50%);
    background:
      radial-gradient(circle at 3px 2.5px, var(--white) 0 2px, transparent 2.1px),
      radial-gradient(circle at 17px 2.5px, var(--white) 0 2px, transparent 2.1px);
  }
  .blue-orb::after {
    top: 24px;
    width: 17px;
    height: 9px;
    transform: translateX(-50%);
    border-bottom: 2px solid var(--white);
    border-radius: 0 0 18px 18px;
  }
  .blue-orb:hover::before,
  .blue-orb:hover::after { opacity: 1; }
  @keyframes orbRoll {
    0% { transform: translate3d(0, 0, 0) scale(1); }
    50% { transform: translate3d(calc(50vw - 55px), 0, 0) scale(.84); }
    100% { transform: translate3d(calc(100vw - 110px), 0, 0) scale(1); }
  }

  .works { padding: 0 var(--page-pad) 76px; }
  .section-label { font-size: 14px; line-height: 1.1; margin: 0 0 13px; font-weight: 500; }
  .works-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 27px 16px;
    align-items: start;
  }
  .work-card { cursor: pointer; border: 0; background: transparent; padding: 0; text-align: left; display: block; min-width: 0; }
  .work-thumb {
    position: relative;
    aspect-ratio: 1.17 / 1;
    border: 1px solid var(--black);
    background: #ddd;
    overflow: hidden;
  }
  .work-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .7s var(--ease), filter .7s var(--ease); }
  .work-num {
    position: absolute;
    top: 13px;
    left: 14px;
    z-index: 2;
    font-size: clamp(17px, 1.6vw, 27px);
    line-height: 1;
    letter-spacing: -.05em;
    font-weight: 400;
  }
  .work-num.is-white { color: var(--white); }
  .work-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: baseline;
    margin-top: 10px;
    font-size: 14px;
    line-height: 1.25;
  }
  .work-name { font-weight: 500; }
  .work-dash { font-weight: 600; }
  .work-desc { font-weight: 500; }
  .work-card:hover .work-thumb img { transform: scale(1.035); filter: saturate(1.05); }
  .work-card:hover .work-name,
  .work-card:hover .work-desc { color: var(--blue); }
  .work-card.poster-card { grid-column: 2 / span 1; }

  .site-footer {
    min-height: 82px;
    padding: 0 var(--page-pad);
    background: var(--footer);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 600;
  }
  .top-link { cursor: pointer; border: 0; background: transparent; padding: 0; font-weight: 600; }
  .top-link:hover { color: var(--blue); }

  .case-page { padding-top: 118px; }
  .case-top { width: var(--case-width); margin: 0 auto 48px; }
  .case-cover {
    width: 100%;
    margin: 0 auto 42px;
  }
  .case-cover .image-frame { min-height: 0; }
  .case-cover .image-frame.is-missing { min-height: 260px; }
  .case-cover .image-frame img { width: 100%; height: auto; object-fit: contain; }
  .case-title { font-size: 0; height: 0; overflow: hidden; }
  .case-meta-table {
    width: 100%;
    font-size: 14px;
    line-height: 1.45;
  }
  .case-meta-row {
    display: grid;
    grid-template-columns: minmax(122px, .25fr) 26px 1fr;
    gap: 18px;
    align-items: start;
    padding: 12px 0;
    border-top: 1px solid var(--line);
  }
  .case-meta-row:last-child { border-bottom: 1px solid var(--line); }
  .case-meta-label { font-weight: 600; }
  .case-meta-colon { font-weight: 600; }
  .case-meta-value { max-width: 760px; text-wrap: pretty; }
  .process-label {
    width: var(--case-width);
    margin: 30px auto 6px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 16px;
    font-size: 14px;
    line-height: 1.1;
    font-weight: 500;
  }
  .process-label::before {
    content: '';
    height: 1px;
    background: var(--line);
    order: 2;
  }
  .process-label .process-left { order: 1; }
  .process-label .process-right { order: 3; text-align: right; }
  .case-flow { padding-bottom: 0; }
  .image-frame {
    width: 100%;
    min-height: 160px;
    position: relative;
    overflow: hidden;
    background: #dedede;
    border: 1px solid var(--black);
  }
  .case-image-block {
    width: var(--case-width);
    margin: 28px auto 0;
  }
  .case-image-block .image-frame { min-height: 260px; }
  .case-image-block img { width: 100%; height: auto; }
  .image-caption {
    font-size: 12px;
    line-height: 1.35;
    margin-top: 9px;
    color: rgba(0,0,0,.68);
  }
  .image-stack {
    width: var(--case-width);
    margin: 28px auto 0;
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
  }
  .image-stack .image-frame { border-bottom: 0; }
  .image-stack .image-frame:last-child { border-bottom: 1px solid var(--black); }
  .image-stack.is-seamless {
    border: 1px solid var(--black);
    background: #dedede;
    overflow: hidden;
  }
  .image-stack.is-seamless .image-frame {
    border: 0;
    min-height: 0;
  }
  .image-stack.is-seamless .image-frame + .image-frame { margin-top: -1px; }
  .image-stack.is-seamless .image-frame::after { inset: 0; }
  .image-stack.is-seamless img {
    display: block;
    width: 100%;
    height: auto;
  }
  .block-label {
    width: var(--case-width);
    margin: 26px auto -14px;
    font-size: 14px;
    line-height: 1.1;
    font-weight: 500;
  }
  .project-link-card {
    width: var(--case-width);
    margin: 28px auto 0;
    border: 1px solid var(--black);
    background: var(--white);
    padding: 13px 26px 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 5px;
  }
  .project-link-card .text-button {
    padding: 0;
    background: transparent;
    font-size: 15px;
  }
  .project-link-card .text-button:hover {
    color: var(--blue);
    background: transparent;
    transform: none;
  }
  .case-actions {
    width: var(--case-width);
    margin: 28px auto 0;
    display: flex;
    gap: 44px;
    flex-wrap: wrap;
    align-items: center;
  }
  .case-actions .text-button { font-size: 15px; }
  .case-actions-single { flex-direction: column; align-items: center; gap: 7px; }
  .button-note { font-size: 11px; line-height: 1.2; color: rgba(0,0,0,.68); }
  .case-cta {
    width: 100%;
    margin: 62px 0 0;
    padding: 38px var(--page-pad) 44px;
    background: var(--footer);
    position: relative;
  }
  .case-cta-inner {
    width: var(--case-width);
    margin: 0 auto;
  }
  .case-cta-title {
    font-size: clamp(25px, 2.4vw, 38px);
    line-height: 1;
    letter-spacing: -.045em;
    font-weight: 600;
    margin: 0 0 20px;
  }
  .case-cta-text {
    max-width: 860px;
    margin: 0 0 20px;
    font-size: 14px;
    line-height: 1.42;
    text-wrap: pretty;
  }
  .case-cta-links { display: flex; gap: 36px; flex-wrap: wrap; }
  .case-cta .top-link {
    position: absolute;
    right: var(--page-pad);
    top: 38px;
  }

  .poster-page {
    padding-top: 118px;
    min-height: 100vh;
    background: #000;
    overflow-x: hidden;
  }
  .poster-note {
    width: min(520px, calc(100vw - 48px));
    margin: 0 auto 62px;
    text-align: center;
    font-size: 14px;
    line-height: 1.1;
    color: var(--white);
  }
  .poster-field {
    width: 100%;
    max-width: 980px;
    margin: 0 auto 104px;
    padding: 22px 0 88px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    perspective: 1260px;
    perspective-origin: 50% 20%;
    transform-style: preserve-3d;
  }
  .poster-item {
    width: clamp(338px, 34vw, 466px);
    aspect-ratio: .707 / 1;
    position: relative;
    display: block;
    background: transparent;
    cursor: pointer;
    z-index: 1;
  }
  .poster-item + .poster-item { margin-top: clamp(-210px, -13vw, -142px); }
  .poster-item::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 52%;
    width: 450%;
    height: 118%;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(ellipse at center,
        rgba(255,255,255,.56) 0%,
        rgba(255,255,255,.34) 28%,
        rgba(255,255,255,.14) 52%,
        rgba(255,255,255,0) 74%);
    opacity: 0;
    pointer-events: none;
    z-index: 0;
    transition: opacity .22s ease;
  }
  .poster-plane {
    position: absolute;
    inset: 0;
    z-index: 1;
    border: 0;
    background: transparent;

const STORAGE_KEY = 'portfolio-lang';
function getStoredLang() {
  try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
}
function setStoredLang(value) {
  try { localStorage.setItem(STORAGE_KEY, value); } catch (e) {}
}
let lang = getStoredLang() || 'ru';
let currentView = { type: 'home' };
const app = document.getElementById('app');

function t(key) { return dictionary[lang][key] || dictionary.ru[key] || key; }
function i18n(value) { return typeof value === 'object' ? (value[lang] || value.ru || '') : value; }
function escapeHtml(str='') {
  return String(str).replace(/[&<>'"]/g, char => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#039;', '"':'&quot;'}[char]));
}
function safeText(str='') { return escapeHtml(str); }
function img(src, alt, cls='') {
  const file = escapeHtml(src);
  return `<div class="image-frame ${cls}" data-file="${file}"><img loading="lazy" decoding="async" src="${file}" alt="${escapeHtml(alt)}" onerror="markMissing(this)"></div>`;
}
function markMissing(el) {
  const frame = el.closest('.image-frame, .work-thumb, .poster-item, .portrait-frame');
  if (frame) frame.classList.add('is-missing');
  el.remove();
}
window.markMissing = markMissing;

let pageLoaderReady = false;
let pageLoadToken = 0;
function beginPageLoad() {
  const loader = document.getElementById('pageLoader');
  if (!loader || !pageLoaderReady) return;
  pageLoadToken += 1;
  loader.classList.remove('is-active');
  void loader.offsetWidth;
  loader.classList.add('is-active');
}
function endPageLoad(token) {
  const loader = document.getElementById('pageLoader');
  if (!loader || token !== pageLoadToken) return;
  loader.classList.remove('is-active');
}
function waitForImagesToSettle(root) {
  const images = Array.from(root.querySelectorAll('img')).slice(0, 8);
  images.forEach((image, index) => {
    image.loading = 'eager';
    if (index < 3) image.fetchPriority = 'high';
  });
  const imagePromises = images.map(image => {
    if (image.complete) return Promise.resolve();
    return new Promise(resolve => {
      image.addEventListener('load', resolve, { once: true });
      image.addEventListener('error', resolve, { once: true });
    });
  });
  const timeout = new Promise(resolve => window.setTimeout(resolve, 1650));
  return Promise.race([Promise.all(imagePromises), timeout]);
}
function queuePageLoadCompletion() {
  const loader = document.getElementById('pageLoader');
  if (!loader || !loader.classList.contains('is-active')) return;
  const token = pageLoadToken;
  const startedAt = performance.now();
  waitForImagesToSettle(app).then(() => {
    const remaining = Math.max(0, 520 - (performance.now() - startedAt));
    window.setTimeout(() => endPageLoad(token), remaining);
  });
}

function renderBlock(block, p) {

  if (block.type === 'links') return renderProjectLinks(p);
  if (block.type === 'actions' && block.custom === 'project') return renderProjectLink(p, block);
  if (block.type === 'stack') {
    const stackClass = `image-stack${block.seamless ? ' is-seamless' : ''}`;
    return `<div class="${stackClass}" aria-label="${safeText(block.caption || '')}">
      ${block.items.map(src => img(src, block.caption || i18n(p.title))).join('')}

  return `<div class="case-image-block">

function switchLanguage(nextLang) {
  if (!nextLang || nextLang === lang) return;
  lang = nextLang;
  setStoredLang(lang);
  if (currentView.type === 'project') renderProject(currentView.slug);
  else renderHome();
}

function afterRender() {
  document.documentElement.lang = lang;
  updateNavText();
  document.querySelectorAll('[data-lang]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
    btn.onclick = (event) => {
      event.preventDefault();
      switchLanguage(btn.dataset.lang);
    };
  });
  document.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => navigate(el.dataset.nav)));
  document.querySelectorAll('[data-project]').forEach(el => el.addEventListener('click', () => goProject(el.dataset.project)));
  initHoverCursor();
  fixRussianTypography(app);
  reveal();
  queuePageLoadCompletion();
}

function initHoverCursor() {
  const cursor = document.getElementById('cursor');
  document.querySelectorAll('a, button, .poster-item').forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
  });
}
function reveal() {
  const items = document.querySelectorAll('.fade-item');
  if (!('IntersectionObserver' in window)) {
    items.forEach(el => el.classList.add('visible'));
    return;
  }
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        if (entry.target.matches('[data-project="proto"], [data-project="pulse4"], [data-project="foum"]')) {
          document.querySelector('[data-project="posters"]')?.classList.add('visible');
        }
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -6% 0px' });
  items.forEach((el, idx) => {
    el.style.transitionDelay = `${Math.min(idx * 24, 180)}ms`;
    observer.observe(el);
  });
}

// Убирает висячие короткие предлоги и союзы в русских текстовых узлах.
function fixRussianTypography(root) {
  if (lang !== 'ru') return;
  const skip = new Set(['SCRIPT', 'STYLE', 'TEXTAREA', 'INPUT']);
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      if (skip.has(node.parentElement?.tagName)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const shortWords = /(^|\s)(в|во|к|ко|с|со|у|о|об|от|до|на|за|по|из|без|для|при|и|а|но)\s+/gi;
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => node.nodeValue = node.nodeValue.replace(shortWords, '$1$2\u00A0'));
}

// Cursor follows pointer without layout thrashing.
const cursor = document.getElementById('cursor');
let cursorX = 0, cursorY = 0, pending = false;
document.addEventListener('mousemove', (event) => {
  cursorX = event.clientX;
  cursorY = event.clientY;
  if (!pending) {
    pending = true;
    requestAnimationFrame(() => {
      cursor.style.left = `${cursorX}px`;
      cursor.style.top = `${cursorY}px`;
      pending = false;
    });
  }
}, { passive: true });

document.addEventListener('click', (event) => {
  const btn = event.target.closest('[data-lang]');
  if (!btn) return;
  event.preventDefault();
  switchLanguage(btn.dataset.lang);
});


const preloaderStartedAt = performance.now();
function hidePreloader() {
  const preloader = document.getElementById('preloader');
  pageLoaderReady = true;
  if (!preloader) return;
  preloader.classList.add('is-hidden');
  window.setTimeout(() => preloader.remove(), 520);
}
window.addEventListener('load', () => {
  const elapsed = performance.now() - preloaderStartedAt;
  window.setTimeout(hidePreloader, Math.max(0, 1150 - elapsed));
});

window.addEventListener('popstate', () => initFromHash());
function initFromHash() {
  const slug = location.hash.replace('#', '');
  const project = projects.find(p => p.slug === slug);
  if (project) return renderProject(project.slug);
  renderHome();
}
initFromHash();
